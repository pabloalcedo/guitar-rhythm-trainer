<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Vista previa de Ritmo de guitarra</title><desc id="desc">Interfaz oscura con controles de tempo en naranja y una guía de ocho pasos en colores naranja, magenta y amarillo.</desc>
<rect width="1100" height="700" fill="#151515"/>
<text x="84" y="54" fill="#b1aba2" font-family="monospace" font-size="13" letter-spacing="1">VISTA PREVIA · PALETA ADAPTADA A LA WEB</text>
<rect x="55" y="78" width="990" height="572" fill="#090909" stroke="#393633"/>
<text x="92" y="128" fill="#e6381b" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">ENTRENAMIENTO RÍTMICO</text>
<text x="92" y="174" fill="#f4f1eb" font-family="Arial,sans-serif" font-size="34" font-weight="700">Ritmo de guitarra</text>
<text x="92" y="203" fill="#b1aba2" font-family="Arial,sans-serif" font-size="15">Sigue el pulso, escucha el acento y toca cada subdivisión.</text>
<rect x="811" y="111" width="190" height="38" fill="#202020" stroke="#393633"/><text x="830" y="135" fill="#b1aba2" font-family="Arial,sans-serif" font-size="13">Listo para practicar</text>
<!-- controls -->
<g font-family="Arial,sans-serif"><g fill="#b1aba2" font-size="12" font-weight="bold"><text x="92" y="252">VELOCIDAD</text><text x="326" y="252">COMPÁS</text><text x="526" y="252">PULSO EQUIVALE A</text><text x="784" y="252">SUBDIVISIÓN</text></g>
<g fill="#202020" stroke="#393633"><rect x="92" y="263" width="205" height="52"/><rect x="326" y="263" width="175" height="52"/><rect x="526" y="263" width="235" height="52"/><rect x="784" y="263" width="217" height="52"/></g>
<g fill="#f4f1eb" font-size="17"><text x="110" y="295" font-weight="bold">90</text><text x="451" y="295" font-size="12">⌄</text><text x="326" y="295">4/4</text><text x="526" y="295">Negra</text><text x="784" y="295">Corcheas</text></g><text x="253" y="295" fill="#b1aba2" font-size="11" font-family="Arial">BPM</text>
<rect x="92" y="326" width="205" height="3" fill="#393633"/><rect x="92" y="326" width="60" height="3" fill="#e6381b"/><circle cx="152" cy="327.5" r="5" fill="#e6381b"/>
</g>
<!-- practice panel -->
<rect x="92" y="361" width="909" height="190" fill="#202020" stroke="#393633"/>
<text x="116" y="393" fill="#b1aba2" font-family="Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="1.4">UN COMPÁS</text><text x="862" y="393" fill="#b1aba2" font-family="Arial,sans-serif" font-size="13">4 pulsos · 8 pasos</text>
<!-- steps -->
<g stroke-width="2"><circle cx="168" cy="457" r="23" fill="#f5bb13" stroke="#ffe07a"/><circle cx="278" cy="457" r="20" fill="#292929" stroke="#c22b83"/><circle cx="388" cy="457" r="23" fill="#321d19" stroke="#a63d2b"/><circle cx="498" cy="457" r="20" fill="#292929" stroke="#57524c"/><circle cx="608" cy="457" r="23" fill="#321d19" stroke="#a63d2b"/><circle cx="718" cy="457" r="20" fill="#292929" stroke="#57524c"/><circle cx="828" cy="457" r="23" fill="#321d19" stroke="#a63d2b"/><circle cx="938" cy="457" r="20" fill="#292929" stroke="#57524c"/></g>
<g fill="#b1aba2" font-family="monospace" font-size="11" text-anchor="middle"><text x="168" y="499">1</text><text x="278" y="499">&amp;</text><text x="388" y="499">2</text><text x="498" y="499">&amp;</text><text x="608" y="499">3</text><text x="718" y="499">&amp;</text><text x="828" y="499">4</text><text x="938" y="499">&amp;</text></g>
<circle cx="121" cy="528" r="5" fill="#e6381b"/><text x="134" y="532" fill="#b1aba2" font-family="Arial,sans-serif" font-size="12">Pulso fuerte</text><circle cx="250" cy="528" r="5" fill="#c22b83"/><text x="263" y="532" fill="#b1aba2" font-family="Arial,sans-serif" font-size="12">Subdivisión</text>
<text x="92" y="594" fill="#b1aba2" font-family="Arial,sans-serif" font-size="13">Ponte cómodo y toca una nota por cada punto iluminado.</text>
<rect x="812" y="565" width="189" height="52" fill="#e6381b"/><text x="906" y="597" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">▶  Empezar</text>
</svg>

